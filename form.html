<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: "Lucida Sans", sans-serif;
      padding: 20px;
    }
.form-container {
  width: 350px;
  height: 500px;
  background-color: linear-gradient(90deg, #ef326f , #fe6c4e );
  box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
  border-radius: 10px;
  box-sizing: border-box;
  padding: 20px 30px;
}

.title {
  text-align: center;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  margin: 10px 0 30px 0;
  font-size: 28px;
  font-weight: 800;
}

.form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 15px;
}

.input {
  border-radius: 20px;
  border: 1px solid #c0c0c0;
  outline: 0 !important;
  box-sizing: border-box;
  padding: 12px 15px;
}

.page-link {
  text-decoration: underline;
  margin: 0;
  text-align: start;
  color: #747474;
  text-decoration-color: #747474;
}

.page-link-label {
  cursor: pointer;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  font-size: 9px;
  font-weight: 700;
}

.page-link-label:hover {
  color: #000;
}

.form-btn {
  padding: 10px 15px;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  border-radius: 20px;
  border: 0 !important;
  outline: 0 !important;
  background: linear-gradient(90deg, #ef326f , #fe6c4e );
  color: white;
  cursor: pointer;
  box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
}

.form-btn:active {
  box-shadow: none;
}

.sign-up-label {
  margin: 0;
  font-size: 10px;
  color: #747474;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
}

.sign-up-link {
  margin-left: 1px;
  font-size: 11px;
  text-decoration: underline;
  text-decoration-color: teal;
  color: teal;
  cursor: pointer;
  font-weight: 800;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
}

.buttons-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  margin-top: 20px;
  gap: 15px;
}
.terms{
    margin-left: 5px;
    cursor: pointer;
    width: 15px;
    height: 15px;
    position: relative;
    top: 2px;
    border-radius: 50%;
    border: 1px solid #747474;
}
.popup {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.popup-content {
  background: white;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
  max-width: 90%;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}

.popup-content p {
  margin-bottom: 20px;
  font-size: 16px;
  color: #333;
}

.hidden {
  display: none;
}
    </style>
</head>
<body>
    <div class="preloader"> 
        <div class="loader4"></div>
  </div>
 <div class="form-container">
    <p class="title">Register Now</p>
    <form class="form" id="registrationForm">
        <input type="text" class="input" placeholder="Full Name" required>
        <input type="email" class="input" placeholder="Email" required>
        <input type="text" class="input" placeholder="Institution (e.g. University of XYZ)" required>
        <input type="text" class="input" placeholder="Field of Study (e.g. Computer Science, IT)" required>
        <p class="page-link">
          <span class="page-link-label">Accept terms and conditions</span>
          <input type="checkbox" class="terms" required>
        </p>
        <button class="form-btn" type="submit">Register</button>
      </form>
      
      <!-- Modal Popup -->
      <div id="popup" class="popup hidden">
        <div class="popup-content">
          <p id="popupMessage"></p>
          <button class="form-btn" onclick="closePopup()">OK</button>
        </div>
      </div>
  </div>

<script>
    function generateEntryCode() {
        const randomNum = Math.floor(1000 + Math.random() * 9000);
        return 'STRIVE' + randomNum;
    }
    
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
        event.preventDefault();
    
        const name = document.querySelector('input[placeholder="Full Name"]').value;
        const email = document.querySelector('input[placeholder="Email"]').value;
        const institution = document.querySelector('input[placeholder="Institution (e.g. University of XYZ)"]').value;
        const field = document.querySelector('input[placeholder="Field of Study (e.g. Computer Science, IT)"]').value;
        const code = generateEntryCode();
    
        const newEntry = {
            name,
            email,
            institution,
            field,
            entryCode: code,
            timestamp: new Date().toLocaleString()
        };
    
        // Get existing registrations
        const registrations = JSON.parse(localStorage.getItem("registrations")) || [];
        registrations.push(newEntry);
        localStorage.setItem("registrations", JSON.stringify(registrations));
    
        document.getElementById("popupMessage").textContent = `Registration successful! Your entry code is: ${code}`;
        document.getElementById("popup").classList.remove("hidden");
        this.reset();
    });
    
    function closePopup() {
        document.getElementById("popup").classList.add("hidden");
    }
    </script>       

</body>
</html>
