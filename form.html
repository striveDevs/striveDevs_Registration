<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Form</title>
  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbx2-DUdgpFbtFC3vvlQbIZyNhQ-EpVjm2mTpG5zhRG4EIRJqQl0FXI6rxt06WzwXB_6RQ/exec";

    function generateEntryCode() {
      return 'E-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("registrationForm");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.querySelector('input[name="fullname"]').value;
        const email = document.querySelector('input[name="email"]').value;
        const institution = document.querySelector('input[name="institution"]').value;
        const field = document.querySelector('input[name="field"]').value;
        const code = generateEntryCode();

        const data = {
          name,
          email,
          institution,
          field,
          entryCode: code
        };

        fetch(scriptURL, {
          method: 'POST',
          body: JSON.stringify(data),
          headers: {
            'Content-Type': 'application/json'
          }
        })
        .then(response => {
          document.getElementById("popupMessage").textContent = `Registration successful! Your entry code is: ${code}`;
          document.getElementById("popup").classList.remove("hidden");
          form.reset();
        })
        .catch(error => {
          alert("Error! " + error.message);
        });
      });
    });

    function closePopup() {
      document.getElementById("popup").classList.add("hidden");
    }
  </script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: "Lucida Sans", sans-serif;
      padding: 20px;
    }

    .form-container {
      width: 350px;
      background: linear-gradient(90deg, #ef326f, #fe6c4e);
      box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
      border-radius: 10px;
      padding: 20px 30px;
    }

    .title {
      text-align: center;
      color: white;
      margin: 10px 0 30px 0;
      font-size: 28px;
      font-weight: 800;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .input {
      border-radius: 20px;
      border: 1px solid #c0c0c0;
      padding: 12px 15px;
      outline: none;
      box-sizing: border-box;
    }

    .page-link {
      font-size: 12px;
      color: white;
      display: flex;
      align-items: center;
    }

    .page-link-label {
      font-size: 10px;
      font-weight: 600;
      margin-right: 10px;
    }

    .terms {
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .form-btn {
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      background: white;
      color: #ef326f;
      font-weight: bold;
      cursor: pointer;
    }

    .form-btn:active {
      box-shadow: none;
    }

    .popup {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .popup-content p {
      margin-bottom: 20px;
      font-size: 16px;
      color: #333;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <p class="title">Register Now</p>
    <form class="form" id="registrationForm">
      <input type="text" class="input" name="fullname" placeholder="Full Name" required>
      <input type="email" class="input" name="email" placeholder="Email" required>
      <input type="text" class="input" name="institution" placeholder="Institution (e.g. University of XYZ)" required>
      <input type="text" class="input" name="field" placeholder="Field of Study (e.g. Computer Science)" required>

      <label class="page-link">
        <span class="page-link-label">Accept terms and conditions</span>
        <input type="checkbox" class="terms" required>
      </label>

      <button class="form-btn" type="submit">Register</button>
    </form>

    <div id="popup" class="popup hidden">
      <div class="popup-content">
        <p id="popupMessage"></p>
        <button class="form-btn" onclick="closePopup()">OK</button>
      </div>
    </div>
  </div>
</body>
</html>
